<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <title>Bạn đang ngoại tuyến - CNL Admin</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0f172a;
        background: linear-gradient(180deg, #f8fcff 0%, #edf6ff 50%, #f6f9fc 100%);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid rgba(191, 219, 254, 0.9);
        border-radius: 28px;
        background: white;
        padding: 28px;
        box-shadow: 0 24px 70px rgba(37, 99, 235, 0.14);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        color: #475569;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 16px;
        border-radius: 16px;
        background: #2563eb;
        padding: 0 18px;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Admin đang ngoại tuyến</h1>
      <p>Trang quản trị không cache dữ liệu riêng tư. Vui lòng kết nối mạng để tải dashboard, job và thông tin khách hàng.</p>
      <a href="/login">Về đăng nhập admin</a>
    </main>
  </body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <title>Bạn đang ngoại tuyến - CNL Service</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0f172a;
        background:
          radial-gradient(circle at 16% 0%, rgba(14, 165, 233, 0.22), transparent 28rem),
          linear-gradient(180deg, #f8fcff 0%, #edf6ff 46%, #f6f9fc 100%);
      }

      main {
        width: min(100%, 520px);
        border: 1px solid rgba(191, 219, 254, 0.9);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.96);
        padding: 28px;
        box-shadow: 0 24px 70px rgba(37, 99, 235, 0.14);
      }

      img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        color: #475569;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-top: 16px;
        border-radius: 16px;
        background: #2563eb;
        padding: 0 18px;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.svg" alt="CNL Service" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Không thể tải trang mới khi mất kết nối. Các thao tác như đặt lịch, upload ảnh và tra cứu job cần mạng để đồng bộ với hệ thống.</p>
      <a href="/">Quay về trang chính</a>
    </main>
  </body>
</html>
